name: Bug report
description: Report a reproducible installation or runtime problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Redact IP addresses, usernames, hostnames, keys, and other infrastructure details.
  - type: input
    id: role
    attributes:
      label: Affected machine
      description: VPS, Home Lab, or laptop
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and personally identifying infrastructure details.
          required: true
        - label: This is not a security vulnerability.
          required: true
